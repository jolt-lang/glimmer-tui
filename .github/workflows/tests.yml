name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jolt
        run: |
          set -euo pipefail
          sudo apt-get update
          # libncursesw6 is what the backend binds; only libtinfo6 is guaranteed
          # by the base system, so ask for it explicitly.
          # ncurses-term carries the terminfo database the smoke step needs:
          # a runner has the library but not necessarily an entry for TERM,
          # and a missing entry is an ncurses exit(), not an error return.
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6 libncursesw6 ncurses-term
          # Install through jolt's own install script rather than resolving the
          # release asset here: it owns the archive and binary naming and
          # verifies the checksum.
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --dir "$HOME/.jolt"
          echo "$HOME/.jolt" >> "$GITHUB_PATH"
      - name: Test
        run: JOLT_PWD="$PWD" jolt -M:test
      # The suite is headless; this covers the ncurses path itself. `script`
      # provides the pty, and TERM has to be set explicitly because a runner
      # leaves it unset, which is a terminfo lookup failure and therefore an
      # ncurses exit(). The output is echoed so a failure here is diagnosable.
      - name: Terminal diagnostics
        env:
          TERM: xterm-256color
        run: |
          echo "TERM=$TERM TERMINFO=${TERMINFO:-unset}"
          ls -d /lib/terminfo /etc/terminfo /usr/share/terminfo 2>&1 || true
          ls /usr/share/terminfo/x 2>/dev/null | head -5 || true
          infocmp -1 xterm-256color 2>&1 | head -3 || true
          script -qec 'tput -T xterm-256color cols' /dev/null || true
      - name: Smoke
        env:
          TERM: xterm-256color
        run: |
          set -o pipefail
          out=$(script -qec "jolt -M:smoke" /dev/null 2>&1 | tr -d '\000' || true)
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -qa "SMOKE OK"; then
            echo "smoke: ran against a real terminal"
          elif printf '%s' "$out" | grep -qaE "SMOKE SKIP|Error opening terminal"; then
            # A runner that cannot host a terminal UI is a skip, not a failure —
            # but say so out loud rather than quietly passing.
            echo "smoke: SKIPPED, this runner has no usable terminal"
          else
            echo "smoke: unexpected output"
            exit 1
          fi
