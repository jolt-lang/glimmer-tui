name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jolt
        run: |
          set -euo pipefail
          sudo apt-get update
          # libncursesw6 is what the backend binds; only libtinfo6 is guaranteed
          # by the base system, so ask for it explicitly.
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6 libncursesw6
          # Install through jolt's own install script rather than resolving the
          # release asset here: it owns the archive and binary naming and
          # verifies the checksum.
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --dir "$HOME/.jolt"
          echo "$HOME/.jolt" >> "$GITHUB_PATH"
      - name: Test
        run: JOLT_PWD="$PWD" jolt -M:test
      # The suite is headless; this covers the ncurses path itself. `script`
      # provides the pty, and TERM has to be set explicitly because a runner
      # leaves it unset, which is a terminfo lookup failure and therefore an
      # ncurses exit(). The output is echoed so a failure here is diagnosable.
      - name: Smoke
        env:
          TERM: xterm-256color
        run: |
          set -o pipefail
          out=$(script -qec "jolt -M:smoke" /dev/null | tr -d '\000' || true)
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -qaE "SMOKE (OK|SKIP)"
